<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ironvale — Village &amp; Siege</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%232c1d12'/%3E%3Cpath d='M3 9h10v5H3z' fill='%238d8a7e'/%3E%3Cpath d='M2 9l6-5 6 5z' fill='%2390392a'/%3E%3Crect x='7' y='11' width='2' height='3' fill='%235b3a1b'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1d140c;
  --panel:#2c1d12;
  --panel2:#3d2919;
  --edge:#c9a367;
  --edge2:#7a5732;
  --tan:#e9d3a6;
  --tan2:#b99a68;
  --gold:#f2c14e;
  --red:#c2452f;
  --green:#7fc24a;
  --blue:#5aa6d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#14100c;}
body{
  font-family:'Pixelify Sans',ui-monospace,'DejaVu Sans Mono',monospace;
  color:var(--tan);
  -webkit-font-smoothing:none;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
}
#app{position:fixed;inset:0;overflow:hidden}
#game{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
  display:block;background:#3f6b34;cursor:grab;
}
#game.drag{cursor:grabbing}

/* ---------- panel chrome ---------- */
.panel{
  position:absolute;
  background:linear-gradient(#3d2919,#2c1d12);
  border:3px solid var(--edge2);
  outline:2px solid var(--ink);
  border-radius:4px;
  box-shadow:0 3px 0 rgba(0,0,0,.45), inset 0 0 0 1px rgba(233,211,166,.18);
  padding:7px 10px;
  font-size:15px;
  line-height:1.25;
}
.panel h2{font-size:20px;color:var(--gold);margin-bottom:4px;font-weight:700}

/* ---------- resources ---------- */
#topbar{top:10px;left:10px;display:flex;gap:14px;align-items:center}
.res{display:flex;align-items:center;gap:5px;font-size:16px;color:#fff;text-shadow:1px 1px 0 #000}
.res b{font-weight:600;letter-spacing:.5px}

.ic{width:14px;height:14px;display:inline-block;flex:0 0 14px;
    background-repeat:no-repeat;background-size:contain;image-rendering:pixelated}
.ic.gold{background:radial-gradient(circle at 35% 32%,#ffe9a0 22%,var(--gold) 45%,#b8860f 100%);border-radius:50%;box-shadow:0 0 0 1px #6b4a06}
.ic.wood{background:linear-gradient(#c08a4d,#7d5228);border-radius:3px;box-shadow:0 0 0 1px #3a2515;height:9px}
.ic.stone{background:linear-gradient(#b9b9b1,#6e6e68);border-radius:2px;box-shadow:0 0 0 1px #35352f}
.ic.food{background:radial-gradient(circle at 35% 30%,#ff8a6a 20%,#c2452f 70%);border-radius:50% 50% 45% 45%;box-shadow:0 0 0 1px #4a1a12}
.ic.pop{background:linear-gradient(#7fc24a,#3f7a20);border-radius:50% 50% 3px 3px;box-shadow:0 0 0 1px #1e3d10}
.ic.skull{background:linear-gradient(#e6e0cf,#a09884);border-radius:50% 50% 35% 35%;box-shadow:0 0 0 1px #2a251c}
.ic.hp{background:linear-gradient(#e05a3d,#8e2417);border-radius:2px;box-shadow:0 0 0 1px #3a1109}
.ic.sword{background:linear-gradient(#dfe4ea,#8a929c);transform:rotate(45deg);width:12px;height:12px;box-shadow:0 0 0 1px #2b3037}
.ic.home{background:linear-gradient(#b5502f,#7a3520);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.ic.scroll{background:linear-gradient(#e9d3a6,#b99a68);border-radius:2px;box-shadow:0 0 0 1px #4a3a22}
.ic.gear{background:conic-gradient(#cfd6dd 0 25%,#8b939c 0 50%,#cfd6dd 0 75%,#8b939c 0);border-radius:50%;box-shadow:0 0 0 1px #333}

/* ---------- wave clock ---------- */
#waveclock{top:10px;right:10px;display:flex;align-items:center;gap:7px;color:#fff;font-size:16px}

/* ---------- quest ---------- */
#questpanel{top:56px;left:10px;width:216px}
.ph{color:var(--gold);font-size:16px;margin-bottom:5px;position:relative;font-weight:700}
.pb{display:flex;gap:7px;align-items:flex-start;font-size:14px;color:#fff}
.chk{width:12px;height:12px;flex:0 0 12px;margin-top:2px;border:2px solid var(--tan2);background:#1b1209;border-radius:2px}
.chk.done{background:var(--green);border-color:#3f7a20}
.bang{
  position:absolute;top:-14px;right:-14px;width:17px;height:17px;border-radius:3px;
  background:var(--red);color:#fff;font-size:13px;line-height:17px;text-align:center;
  border:2px solid #6b1d12;box-shadow:0 2px 0 rgba(0,0,0,.4);
  animation:bob .9s ease-in-out infinite alternate;
}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.bar{margin-top:6px;height:9px;background:#1b1209;border:2px solid #6b4a2a;border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0%;background:linear-gradient(var(--gold),#c08a1e);transition:width .25s}
.bar.hp>i{background:linear-gradient(#e05a3d,#8e2417)}
.bar.foe>i{background:linear-gradient(#b06adf,#5c2a86)}

/* ---------- stats ---------- */
#statpanel{top:56px;right:10px;width:196px}
#statpanel .row{display:flex;align-items:center;gap:7px;font-size:14px;color:#fff;margin-top:6px}
#statpanel .row:first-child{margin-top:0}

/* ---------- toolbar ---------- */
#toolbar{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  display:flex;gap:8px;
}
#toolbar button{
  background:linear-gradient(#3d2919,#2c1d12);color:var(--tan);
  border:3px solid var(--edge2);outline:2px solid var(--ink);border-radius:4px;
  font-family:inherit;font-size:13px;padding:7px 12px 5px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.45);
}
#toolbar button:hover{background:linear-gradient(#4d3520,#372213);color:#fff}
#toolbar button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#toolbar .ic{width:18px;height:18px;flex:0 0 18px}

/* ---------- sheets ---------- */
.sheet{
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(520px,calc(100vw - 28px));
  max-height:min(76vh,620px);overflow:auto;
  padding:16px 18px 18px;z-index:20;
}
.sheet .x{
  position:absolute;top:8px;right:8px;width:26px;height:26px;
  background:#4a2f1c;color:var(--tan);border:2px solid var(--edge2);border-radius:3px;
  font-family:inherit;font-size:14px;cursor:pointer;line-height:1;
}
.sheet .x:hover{background:var(--red);color:#fff}
.hidden{display:none !important}

.bp-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
#bp-icon{
  width:72px;height:72px;flex:0 0 72px;image-rendering:pixelated;
  background:#43301c;border:2px solid var(--edge2);border-radius:3px;
}
.tier{color:var(--gold);font-size:14px;margin-bottom:5px}
.bp-head p{font-size:13px;color:var(--tan2);line-height:1.4}

.bp-stats{display:grid;grid-template-columns:1fr auto auto auto;gap:5px 9px;font-size:14px;align-items:center;
  background:#241609;border:2px solid #5a3f24;border-radius:3px;padding:9px 11px;margin-bottom:11px}
.bp-stats .k{color:var(--tan2)}
.bp-stats .a{color:#fff;text-align:right}
.bp-stats .ar{color:var(--tan2);text-align:center}
.bp-stats .b{color:var(--green);text-align:right;font-weight:600}

.bp-cost{display:flex;gap:16px;justify-content:center;margin-bottom:11px;font-size:16px}
.bp-cost .c{display:flex;align-items:center;gap:5px;color:#fff}
.bp-cost .c.no{color:#e0603f}

.cta{
  width:100%;background:linear-gradient(#6f9c3a,#3f6b20);color:#fff;
  border:3px solid #2c4a15;outline:2px solid var(--ink);border-radius:4px;
  font-family:inherit;font-size:18px;padding:9px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.45);text-shadow:1px 1px 0 rgba(0,0,0,.4);
}
.cta:hover{filter:brightness(1.12)}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.cta:disabled{background:linear-gradient(#5b5348,#3a352d);border-color:#2a251f;cursor:not-allowed;filter:none;color:#9a9086}
.bp-note{font-size:13px;color:var(--tan2);text-align:center;margin-top:8px;min-height:16px}

/* list rows in sheets */
.lrow{display:flex;gap:11px;align-items:center;padding:8px 10px;background:#241609;
  border:2px solid #5a3f24;border-radius:3px;margin-bottom:7px}
.lrow canvas{width:32px;height:32px;flex:0 0 32px;image-rendering:pixelated}
.lrow .n{flex:1;font-size:15px;color:#fff}
.lrow .d{font-size:12px;color:var(--tan2);display:block;margin-top:2px}
.lrow .v{font-size:16px;color:var(--gold)}
.logline{font-size:13px;color:var(--tan);padding:4px 0;border-bottom:1px solid #4a3521}
.logline b{color:var(--gold)}
#sh-body p{font-size:14px;line-height:1.55;margin-bottom:9px;color:var(--tan)}
#sh-body h3{color:var(--gold);font-size:16px;margin:12px 0 5px}
#sh-body kbd{background:#43301c;border:2px solid var(--edge2);border-radius:3px;padding:1px 5px;font-family:inherit;font-size:12px}

/* defeat */
#defeat{position:absolute;inset:0;background:rgba(10,6,3,.82);z-index:40}
#defeat .sheet{width:min(430px,calc(100vw - 28px));text-align:center}
#defeat p{font-size:14px;line-height:1.55;margin:10px 0 16px;color:var(--tan)}

/* toasts */
#toasts{position:absolute;bottom:78px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:linear-gradient(#3d2919,#2c1d12);border:3px solid var(--edge2);outline:2px solid var(--ink);
  border-radius:4px;padding:6px 13px;font-size:14px;color:#fff;
  animation:tin .25s ease-out, tout .4s ease-in 2.4s forwards}
.toast.good{border-color:#4a7a28}
.toast.bad{border-color:#8e2417}
@keyframes tin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-9px)}}

/* small screens */
@media (max-width:620px){
  #questpanel{width:170px;font-size:13px}
  #statpanel{width:150px}
  #topbar{gap:9px;font-size:13px;padding:5px 7px}
  .res{font-size:13px}
  #toolbar button{min-width:54px;font-size:11px;padding:6px 8px 4px}
}

</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- top-left resource bar -->
  <div id="topbar" class="panel">
    <span class="res" title="Gold"><i class="ic gold"></i><b id="r-gold">0</b></span>
    <span class="res" title="Wood"><i class="ic wood"></i><b id="r-wood">0</b></span>
    <span class="res" title="Stone"><i class="ic stone"></i><b id="r-stone">0</b></span>
    <span class="res" title="Food"><i class="ic food"></i><b id="r-food">0</b></span>
    <span class="res" title="Population"><i class="ic pop"></i><b id="r-pop">0/0</b></span>
  </div>

  <!-- top-right wave clock -->
  <div id="waveclock" class="panel">
    <i class="ic skull"></i><b id="wave-label">Wave 1</b>
  </div>

  <!-- left quest / objective -->
  <div id="questpanel" class="panel">
    <div class="ph">Current Objective<span class="bang" id="quest-bang">!</span></div>
    <div class="pb"><span class="chk" id="quest-chk"></span><span id="quest-text">Raise the Town Hall</span></div>
    <div class="bar"><i id="quest-bar"></i></div>
  </div>

  <!-- right stat readout -->
  <div id="statpanel" class="panel">
    <div class="row"><i class="ic hp"></i><span id="s-hp-label">Town Hall</span></div>
    <div class="bar hp"><i id="s-hp-bar"></i></div>
    <div class="row"><i class="ic sword"></i><span id="s-army">Army 0</span></div>
    <div class="bar"><i id="s-army-bar"></i></div>
    <div class="row"><i class="ic skull"></i><span id="s-foes">Foes 0</span></div>
    <div class="bar foe"><i id="s-foe-bar"></i></div>
  </div>

  <!-- building upgrade sheet -->
  <div id="buildpanel" class="panel sheet hidden">
    <button id="bp-close" class="x">✕</button>
    <div class="bp-head">
      <canvas id="bp-icon" width="72" height="72"></canvas>
      <div>
        <h2 id="bp-name">Town Hall</h2>
        <div class="tier" id="bp-tier">Level 1 · Tier I</div>
        <p id="bp-blurb"></p>
      </div>
    </div>
    <div class="bp-stats" id="bp-stats"></div>
    <div class="bp-cost" id="bp-cost"></div>
    <button id="bp-upgrade" class="cta">Upgrade</button>
    <div class="bp-note" id="bp-note"></div>
  </div>

  <!-- bottom toolbar -->
  <div id="toolbar">
    <button data-tab="village"><i class="ic home"></i><span>Village</span></button>
    <button data-tab="army"><i class="ic sword"></i><span>Army</span></button>
    <button data-tab="log"><i class="ic scroll"></i><span>Log</span><span class="bang" id="log-bang">!</span></button>
    <button data-tab="help"><i class="ic gear"></i><span>Help</span></button>
  </div>

  <!-- generic list sheet (army / log / help) -->
  <div id="sheet" class="panel sheet hidden">
    <button id="sh-close" class="x">✕</button>
    <h2 id="sh-title">Army</h2>
    <div id="sh-body"></div>
  </div>

  <!-- defeat -->
  <div id="defeat" class="hidden">
    <div class="panel sheet">
      <h2>The village has fallen</h2>
      <p id="df-text"></p>
      <button id="df-btn" class="cta">Rebuild</button>
    </div>
  </div>

  <div id="toasts"></div>
</div>
<script>
(() => {
  // src/config.js
  var BASE_W = 400;
  var WORLD = { W: 400, H: 910 };
  var ZOOM_MIN = 0.72;
  var ZOOM_MAX = 3.2;
  var TERRAIN_PAD = 190;
  var GATE_Y = 640;
  var GATE_X = 240;
  var SPAWN_Y = -8;
  var RALLY_Y = 470;
  var HALL_PT = { x: 200, y: 704 };
  var VIS_STEP = 5;
  var TIER_MAX = 5;
  var tierOf = (lvl2) => Math.min(TIER_MAX, 1 + Math.floor((lvl2 - 1) / VIS_STEP));
  var ROMAN = ["", "I", "II", "III", "IV", "V"];
  var RATES = { gold: 2.1, wood: 1.6, stone: 1, food: 1.1 };
  var RATE_MUL = 1.37;
  var TROOP_MUL = 1.36;
  var rateFor = (res, l) => RATES[res] * Math.pow(RATE_MUL, Math.max(1, l) - 1);
  var P = (b, m) => (lvl2) => Math.round(b * Math.pow(m, lvl2 - 1));
  var BUILDINGS = [
    {
      id: "townhall",
      name: "Town Hall",
      art: "townhall",
      x: 168,
      y: 676,
      w: 64,
      h: 54,
      blurb: "The heart of Ironvale. Caps how far every other building may be raised, and its own walls are what the horde must break.",
      base: { gold: 180, wood: 140, stone: 90 },
      mul: 1.42,
      stats: (l) => ({
        "Level cap": { v: l + 5, s: "" },
        "Hall HP": { v: Math.round(500 * Math.pow(1.38, l - 1)), s: "" },
        "Population": { v: 10 + l * 5, s: "" }
      })
    },
    {
      id: "farm",
      name: "Farmstead",
      art: "farm",
      x: 16,
      y: 690,
      w: 64,
      h: 42,
      blurb: "Grain, cattle and hens. Soldiers eat \u2014 an empty larder saps their strength in the field.",
      base: { gold: 60, wood: 40 },
      mul: 1.42,
      stats: (l) => ({ "Food / sec": { v: +rateFor("food", l).toFixed(2), s: "" } })
    },
    {
      id: "lumber",
      name: "Lumber Camp",
      art: "lumber",
      x: 40,
      y: 770,
      w: 68,
      h: 44,
      blurb: "A saw pit and a stack of felled pine. Wood underwrites nearly every rebuild.",
      base: { gold: 50, wood: 25 },
      mul: 1.4,
      stats: (l) => ({ "Wood / sec": { v: +rateFor("wood", l).toFixed(2), s: "" } })
    },
    {
      id: "quarry",
      name: "Quarry",
      art: "quarry",
      x: 272,
      y: 852,
      w: 60,
      h: 42,
      blurb: "Cut stone for walls that actually hold. Slower than timber, and worth more.",
      base: { gold: 90, wood: 60 },
      mul: 1.43,
      stats: (l) => ({ "Stone / sec": { v: +rateFor("stone", l).toFixed(2), s: "" } })
    },
    {
      id: "market",
      name: "Market",
      art: "market",
      x: 160,
      y: 784,
      w: 52,
      h: 40,
      blurb: "Stalls, scales and a very loud trader. Turns the valley\u2019s traffic into coin.",
      base: { gold: 130, wood: 70, stone: 40 },
      mul: 1.44,
      stats: (l) => ({ "Gold / sec": { v: +rateFor("gold", l).toFixed(2), s: "" } })
    },
    {
      id: "tavern",
      name: "Tavern",
      art: "tavern",
      x: 64,
      y: 856,
      w: 56,
      h: 44,
      blurb: "Beds upstairs, ale downstairs. Draws settlers to the valley and takes a cut of every round.",
      base: { gold: 190, wood: 130, stone: 60 },
      mul: 1.46,
      stats: (l) => ({
        "Population": { v: l * 4, s: "+" },
        "Gold bonus": { v: l * 6, s: "%" }
      })
    },
    {
      id: "barracks",
      name: "Barracks",
      art: "barracks",
      x: 252,
      y: 686,
      w: 52,
      h: 42,
      blurb: "Drills militia, and from level 8 fields armoured knights. Your front line lives and dies here.",
      base: { gold: 150, wood: 100, stone: 50 },
      mul: 1.45,
      unit: "militia",
      stats: (l) => ({
        "Militia power": { v: Math.round(100 * Math.pow(TROOP_MUL, l - 1)), s: "%" },
        "Train speed": { v: +(6 / (1 + 0.16 * (l - 1))).toFixed(1), s: "s" },
        "Knights": { v: l >= 8 ? "yes" : "lvl 8", s: "" }
      })
    },
    {
      id: "archery",
      name: "Archery Range",
      art: "archery",
      x: 268,
      y: 760,
      w: 56,
      h: 38,
      blurb: "Butts and straw targets. Archers out-range everything the horde brings until the shamans arrive.",
      base: { gold: 185, wood: 145, stone: 40 },
      mul: 1.45,
      unit: "archer",
      stats: (l) => ({
        "Archer power": { v: Math.round(100 * Math.pow(TROOP_MUL, l - 1)), s: "%" },
        "Train speed": { v: +(7 / (1 + 0.16 * (l - 1))).toFixed(1), s: "s" }
      })
    },
    {
      id: "magetower",
      name: "Mage Tower",
      art: "magetower",
      x: 344,
      y: 752,
      w: 34,
      h: 58,
      blurb: "Slow to cast, but the bolt splashes. The only sane answer to a packed wave.",
      base: { gold: 380, wood: 190, stone: 210 },
      mul: 1.47,
      unit: "mage",
      req: { townhall: 6 },
      stats: (l) => ({
        "Mage power": { v: Math.round(100 * Math.pow(TROOP_MUL, l - 1)), s: "%" },
        "Train speed": { v: +(13 / (1 + 0.14 * (l - 1))).toFixed(1), s: "s" },
        "Splash": { v: 14 + l, s: "px" }
      })
    },
    {
      id: "blacksmith",
      name: "Blacksmith",
      art: "blacksmith",
      x: 96,
      y: 684,
      w: 48,
      h: 44,
      blurb: "Sharpens and plates everything that marches. A flat multiplier on the whole army \u2014 usually your best coin.",
      base: { gold: 230, wood: 120, stone: 150 },
      mul: 1.46,
      stats: (l) => ({
        "Army attack": { v: l * 9, s: "%" },
        "Army health": { v: l * 7, s: "%" }
      })
    },
    {
      id: "watchtower",
      name: "Watchtower",
      art: "watchtower",
      x: 338,
      y: 660,
      w: 26,
      h: 62,
      blurb: "A bowman with the high ground. Fires on anything that reaches the palisade \u2014 your last line when the field is lost.",
      base: { gold: 170, wood: 110, stone: 130 },
      mul: 1.45,
      stats: (l) => ({
        "Tower damage": { v: Math.round(9 * Math.pow(1.32, l - 1)), s: "" },
        "Range": { v: 55 + l * 4, s: "px" },
        "Rate": { v: +(1.5 / (1 + 0.1 * (l - 1))).toFixed(2), s: "s" }
      })
    }
  ];
  var BY_ID = Object.fromEntries(BUILDINGS.map((b) => [b.id, b]));
  function costFor(def, lvl2) {
    const out = {};
    const k = Math.pow(def.mul, lvl2);
    for (const r2 in def.base) out[r2] = Math.ceil(def.base[r2] * k);
    return out;
  }
  var TROOPS = {
    militia: {
      name: "Militia",
      from: "barracks",
      pop: 1,
      food: 0.05,
      hp: P(34, TROOP_MUL),
      dmg: P(5.5, TROOP_MUL),
      range: 9,
      atk: 1,
      spd: 15,
      w: 6,
      h: 9
    },
    knight: {
      name: "Knight",
      from: "barracks",
      pop: 2,
      food: 0.09,

    const h = Math.floor(gain.away / 3600), m = Math.floor(gain.away % 3600 / 60);
    const parts = Object.entries(gain.gained).filter(([, v]) => v > 0).map(([k, v]) => `${fmt(v)} ${k}`).join(", ");
    if (parts) toast(`Away ${h ? h + "h " : ""}${m}m \u2014 stores gathered ${parts}`, "good");
  }
  function wireUi(api2) {
    $("bp-close").onclick = closeBuilding;
    $("bp-upgrade").onclick = doUpgrade;
    $("sh-close").onclick = closeSheet;
    for (const btn of document.querySelectorAll("#toolbar button")) {
      btn.onclick = () => {
        const tab = btn.dataset.tab;
        if (tab === "village") {
          closeSheet();
          closeBuilding();
          api2.goVillage();
          return;
        }
        if ($("sheet").classList.contains("hidden") === false && $("sh-title").dataset.tab === tab) {
          closeSheet();
          return;
        }
        if (tab === "army") openSheet("Army", armySheet());
        if (tab === "log") openSheet("Chronicle", logSheet());
        if (tab === "help") openSheet("How Ironvale works", helpSheet());
        $("sh-title").dataset.tab = tab;
        refreshSheetCanvases();
      };
    }
  }

  // src/main.js
  var canvas = document.getElementById("game");
  var g = resize(canvas);
  initArt();
  var offline = load();
  if (!S.hallHp) S.hallHp = hallMax();
  initVillage();
  var cam = { x: 0, y: camMax(), target: null };
  var hover = null;
  var paused = false;
  var time = 0;
  var api = {
    goVillage() {
      cam.target = camMax();
    },
    goBattle() {
      cam.target = 0;
    },
    toggleView() {
      if (cam.y > camMax() * 0.5) api.goBattle();
      else api.goVillage();
    }
  };
  wireUi(api);
  var tickInput = wireInput(canvas, cam, {
    onTap(id) {
      if (id) selectBuilding(id);
      else {
        closeBuilding();
        closeSheet();
      }
    },
    onHover(id) {
      hover = id;
      canvas.style.cursor = id ? "pointer" : "";
    },
    onEscape() {
      closeBuilding();
      closeSheet();
    },
    onToggle() {
      api.toggleView();
    }
  });
  window.addEventListener("resize", () => {
    g = resize(canvas);
    clampCam(cam);
  });
  hooks.toast = toast;
  hooks.onWave = (n) => {
    if (n % 5 === 0) toast(`Wave ${n} \u2014 an Ogre marches with them`, "bad");
  };
  hooks.onDefeat = () => {
    if (paused) return;
    paused = true;
    logLine(`The Town Hall fell on wave ${S.wave}.`);
    clearField();
    save();
    showDefeat(() => {
      S.wave = 1;
      S.phase = "calm";
      S.timer = INTERMISSION;
      S.hallHp = hallMax();
      S.res.food = Math.max(S.res.food, 60);
      clearField();
      logLine("The valley regroups. The horde returns from wave 1.");
      paused = false;
      save();
    });
  };
  S.phase = "calm";
  S.timer = 8;
  if (offline) showOffline(offline);
  if (!S.seenIntro) {
    S.seenIntro = true;
    document.querySelector('#toolbar button[data-tab="help"]').click();
  }
  window.IV = {
    S,
    cam,
    api,
    save,
    camMax,
    VP,
    upgrade: (id) => tryUpgrade(id, true),
    // Fast-forward the simulation in fixed steps (debugging / balance checks).
    ff(seconds, step = 0.05) {
      for (let t = 0; t < seconds; t += step) {
        tickEconomy(step);
        tickCombat(step);
        tickVillage(step);
        if (paused) break;
      }
    }
  };
  var last = performance.now();
  var saveT = 0;
  function frame(now) {
    const dt = Math.min(TICK_MAX, (now - last) / 1e3);
    last = now;
    time += dt;
    tickInput(dt);
    if (!paused) {
      tickEconomy(dt);
      tickCombat(dt);
      tickVillage(dt);
      saveT += dt;
      if (saveT > 10) {
        saveT = 0;
        save();
      }
    }
    draw(g, cam, time, getSelected(), hover);
    updateHud(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) save();
    else last = performance.now();
  });
  window.addEventListener("beforeunload", save);
  var warned = false;
  hooks.onWave = /* @__PURE__ */ ((prev) => (n) => {
    prev?.(n);
    if (!warned && n >= 1 && cam.y > camMax() * 0.5) {
      warned = true;
      toast("The horde is marching \u2014 scroll up (Space) to watch the line", "");
    }
  })(hooks.onWave);
})();

</script>
